[project]
name = "yt-downloader-api"
version = "1.0.2"
description = "FastAPI backend for a trusted-LAN YouTube downloader"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "redis[hiredis]>=7.4.0",
    "uvicorn[standard]>=0.46.0",
    "yt-dlp>=2026.3.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.35.0",
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_downloader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["../tests/api"]
