name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend format presets
        run: npm run test:format-presets

      - name: Test frontend recent jobs
        run: npm run test:recent-jobs

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.9"

      - name: Install API dependencies
        run: uv sync --frozen --group dev

      - name: Test API
        run: uv run pytest

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - frontend
      - api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config -q

      - name: Build Compose services
        run: docker compose build
