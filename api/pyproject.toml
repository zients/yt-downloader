[project]
name = "yt-downloader-api"
version = "0.1.0"
description = "FastAPI backend for a trusted-LAN YouTube downloader"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis[hiredis]>=5.0.0",
    "uvicorn[standard]>=0.30.0",
    "yt-dlp>=2024.12.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.25.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_downloader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["../tests/api"]
